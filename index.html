<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planet Pals</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planet Pals">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
  html, body {
    margin: 0;
    height: 100%;
    background: #060a1f;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #grown-ups { position: fixed; top: calc(var(--safe-top) + 5px); left: 50%; transform: translateX(-50%); color: #c5cfe6; background: #17233b; border: 1px solid #53647b; border-radius: 20px; font: 600 12px system-ui; padding: 8px 14px; min-height: 32px; }
  #sound-help { color: #f4f7ff; background: #17233b; border: 2px solid #7286ad; border-radius: 22px; padding: 22px; width: min(420px, calc(100% - 64px)); max-height: calc(100% - 80px - var(--safe-top) - var(--safe-bottom)); overflow: auto; font: 16px/1.45 system-ui; touch-action: pan-y; }
  #sound-help::backdrop { background: #060a1fce; }
  #sound-help h1 { font-size: 24px; margin: 0 0 12px; }
  #sound-help button { min-height: 44px; padding: 10px 14px; margin: 4px 2px; border: 2px solid #7286ad; border-radius: 12px; color: #fff; background: #283e5b; font: 700 15px system-ui; touch-action: manipulation; }
  #sound-help button[aria-pressed="true"] { color: #17233b; background: #ffe497; border-color: #ffe497; }
  #sound-help button:focus-visible, #grown-ups:focus-visible { outline: 3px solid #8feaff; outline-offset: 3px; }
  #sound-status { min-height: 3em; }
  #sound-help summary { min-height: 44px; cursor: pointer; }
  #sound-details-text { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 monospace; user-select: text; }
  #close-sound-help { float: right; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="grown-ups" type="button" aria-haspopup="dialog" aria-controls="sound-help">Grown-ups</button>
<dialog id="sound-help" aria-labelledby="sound-help-title">
  <button id="close-sound-help" type="button" aria-label="Close sound help">Done</button>
  <h1 id="sound-help-title">Sound &amp; help</h1>
  <p>Pick the sound level for your family.</p>
  <div role="group" aria-label="Sound level">
    <button type="button" data-sound-mode="normal" aria-pressed="false">Normal</button>
    <button type="button" data-sound-mode="soft" aria-pressed="false">Soft</button>
    <button type="button" data-sound-mode="off" aria-pressed="false">Off</button>
  </div>
  <p>No sound? Turn up your device volume and check whether sound is going to headphones or another speaker. On iPad, also check Silent Mode.</p>
  <p>The voice check may use your device’s playback volume.</p>
  <button id="try-voice" type="button">Try voice</button>
  <button id="try-note" type="button">Try music</button>
  <p id="sound-status" role="status" aria-live="polite"></p>
  <details id="sound-details"><summary>Browser details for help</summary><pre id="sound-details-text"></pre></details>
</dialog>
<script src="device-audio.js"></script>
<script src="game.js"></script>
</body>
</html>
